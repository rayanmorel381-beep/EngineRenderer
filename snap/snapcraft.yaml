name: ruxel
title: RUXEL
base: core22
version: "0.0.1"
summary: RUXEL — Real-time Unobtained Xenom Engine Layer
description: |
  RUXEL is a real-time renderer and editor built on the EngineRenderer core.
  It bundles the desktop Linux shell with the shared engine library.
license: MIT
contact: https://github.com/rayanmorel381-beep/EngineRenderer/issues
issues: https://github.com/rayanmorel381-beep/EngineRenderer/issues
source-code: https://github.com/rayanmorel381-beep/EngineRenderer
website: https://github.com/rayanmorel381-beep/EngineRenderer

grade: stable
confinement: strict

apps:
  ruxel:
    command: bin/ruxel
    desktop: share/applications/ruxel.desktop
    extensions:
      - gnome
    plugs:
      - opengl
      - wayland
      - x11
      - desktop
      - desktop-legacy
      - home

parts:
  ruxel:
    plugin: rust
    source: .
    rust-path:
      - RUXEL/crates/desktop-linux

  desktop-file:
    plugin: dump
    source: RUXEL/packaging/linux
    organize:
      ruxel.desktop: share/applications/ruxel.desktop
