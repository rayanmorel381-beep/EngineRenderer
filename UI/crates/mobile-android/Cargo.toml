[package]
name = "ruxel-mobile-android"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
authors = ["Rayan Morel"]
license = "MIT"
description = "Android shell for RUXEL (cdylib loaded by NativeActivity / Gradle APK)."

[lib]
name = "ruxel_mobile_android"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
ruxel-core = { path = "../core" }
enginerenderer = { path = "../../../EngineRenderer" }
