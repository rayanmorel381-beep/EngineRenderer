[package]
name = "enginerenderer"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
authors = ["Rayan Morel"]
license = "MIT"
description = "A zero-dependency offline rendering engine in pure Rust — CPU path tracing, BVH acceleration, 16-band spectral rendering, PBR materials, animation & video export."
repository = "https://github.com/rayanmorel381-beep/EngineRenderer"
homepage = "https://github.com/rayanmorel381-beep/EngineRenderer"
documentation = "https://docs.rs/enginerenderer"
readme = "ReadMe.md"
keywords = ["rendering", "path-tracing", "3d", "animation", "ray-tracing"]
categories = ["graphics", "multimedia", "simulation", "science"]
include = [
    "src/**/*.rs",
    "benches/**/*.rs",
    "tests/**/*.rs",
    "examples/**/*.rs",
    "fpstests/**/*.md",
    "Cargo.toml",
    "ReadMe.md",
    "License",
    "ChangeLog.md",
    "CONTRIBUTING.md",
    "arborescence.md",
    "quickstart.md",
]

[workspace]

[lib]
name = "enginerenderer"
path = "src/lib.rs"

[[bin]]
name = "enginerenderer"
path = "src/main.rs"

[[bench]]
name = "parsers"
path = "benches/parsers.rs"
harness = false

[[bench]]
name = "android_gpu"
path = "benches/android_gpu.rs"
harness = false

[[bench]]
name = "desktop_gpu"
path = "benches/desktop_gpu.rs"
harness = false

